services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  web-app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"
    ports:
      - "5002:5000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./static:/app/static
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/data/virtualnet.db
      - REDIS_URL=redis://redis:6379/0
    restart: always

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: always
