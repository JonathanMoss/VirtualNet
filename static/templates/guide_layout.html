<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - VirtualNet User Guide</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Monospace Tactical CRT & Guide Styles -->
  <link href="/static/css/style.css" rel="stylesheet">
  <link href="/static/css/guides.css" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100">

  <!-- Header Bar -->
  <header class="navbar navbar-dark bg-dark border-bottom border-secondary px-3 py-2 shadow-sm">
    <div class="container-fluid flex-nowrap align-items-center">
      <a class="navbar-brand font-weight-bold text-uppercase d-flex align-items-center text-phosphor-green" href="/">
        📟 VIRTUALNET
      </a>
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-outline-secondary text-warning border border-warning px-2 py-1">{{ guide_type }}</span>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container guide-container flex-grow-1 py-4">
    <div class="card shadow-lg border-secondary">
      <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="fs-5 text-uppercase">📖 USER DOCUMENTATION</span>
        <div class="d-flex gap-2">
          <a href="/guide/student" class="btn btn-sm {% if guide_id == 'student' %}btn-tactical{% else %}btn-outline-tactical{% endif %}">📖 STUDENT GUIDE</a>
          <a href="/guide/sunray" class="btn btn-sm {% if guide_id == 'sunray' %}btn-tactical{% else %}btn-outline-tactical{% endif %}">👑 SUNRAY GUIDE</a>
        </div>
      </div>
      <div class="card-body p-4 guide-content">
        {{ content|safe }}
      </div>
    </div>
  </main>

  <a href="#" class="btn btn-tactical btn-back-to-top" title="Back to Top">⬆</a>

  <!-- Footer -->
  <footer class="footer mt-auto py-2 bg-dark border-top border-secondary text-center">
    <div class="container">
      <span class="text-muted small">VIRTUALNET TACTICAL RADIO SIMULATOR &bull; USER GUIDES &bull; CONFIDENTIAL / TRAINING USE ONLY</span>
    </div>
  </footer>

</body>
</html>
