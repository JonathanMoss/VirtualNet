<!-- Create Net Card (SUNRAY View - Hidden by default) -->
<div id="create-net-card" class="col-md-5 d-none">
  <div class="card shadow-lg border-secondary">
    <div class="card-header text-center">
      <h3>HOST NEW NET SESSION (SUNRAY)</h3>
    </div>
    <div class="card-body p-4">
      <div id="create-net-form">
        <div class="mb-3">
          <label for="create-name" class="form-label text-uppercase">Net Session Name</label>
          <input type="text" class="form-control" id="create-name" placeholder="e.g. Exercise Drill Alpha" maxlength="50" autocomplete="off" required>
        </div>
        <div class="mb-3">
          <label for="create-sunray-callsign" class="form-label text-uppercase">SUNRAY Callsign</label>
          <input type="text" class="form-control text-uppercase text-center font-weight-bold" id="create-sunray-callsign" placeholder="0" maxlength="15" value="0" autocomplete="off">
        </div>
        <div class="mb-3">
          <label for="create-instructor-pin" class="form-label text-uppercase">Daily Instructor 6-Digit PIN</label>
          <input type="text" inputmode="numeric" class="form-control text-center input-pin-masked" id="create-instructor-pin" placeholder="Enter 6-digit PIN" maxlength="6" pattern="\d{6}" autocomplete="off" data-lpignore="true" data-bwignore="true" required>
        </div>
        <button type="button" id="btn-create-net" class="btn btn-tactical w-100 mt-2">CREATE NET SESSION</button>
        <button type="button" id="btn-preload-last-net" class="btn btn-outline-secondary btn-sm w-100 mt-2 d-none" title="Pre-fill settings from your previous net session">LOAD LAST NET SETTINGS</button>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary small">
        <a href="/guide/sunray" target="_blank" class="text-decoration-none text-tactical-amber">Sunray Guide (in new tab)</a>
        <a href="#" id="toggle-join-view" class="text-decoration-none text-muted">Back to Student Log-in</a>
      </div>
    </div>
  </div>
</div>
