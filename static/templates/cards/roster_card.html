<!-- Left Sidebar: NET Roster (Vertical Foldable Panel) -->
<aside id="net-roster-sidebar" class="col-12 col-md-auto net-sidebar d-flex flex-column mb-2 mb-md-0 net-sidebar-responsive">
  <div class="card flex-grow-1 overflow-hidden h-100">
    <div id="roster-card-header" class="card-header text-uppercase d-flex justify-content-between align-items-center py-2 px-3 cursor-pointer-select-none">
      <span class="font-weight-bold d-flex align-items-center gap-2 fs-6">
        <span class="roster-title-text">NET</span>
      </span>
      <button id="btn-toggle-roster" class="btn btn-sm text-success p-0 border-0 shadow-none" title="Toggle NET panel">
        <span class="toggle-icon d-inline-block transition-transform">◀</span>
      </button>
    </div>
    <div id="roster-collapse-body" class="flex-grow-1 overflow-auto">
      <div class="list-group list-group-flush list-group-tactical" id="roster-list">
        <!-- Dynamically populated roster -->
      </div>
    </div>
  </div>
</aside>
