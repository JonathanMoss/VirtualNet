<!-- Reference Resources Card (Issue #15: BATCO, VOCAB CARD, SLATE CARDS) -->
<section class="card flex-grow-1 d-flex flex-column overflow-hidden">
  <div class="card-header py-2 bg-dark">
    <div class="nav-tabs-responsive">
      <ul class="nav nav-tabs card-header-tabs flex-nowrap" id="resource-tabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active text-uppercase font-weight-bold text-success" id="tab-batco-slider-link" data-bs-toggle="tab" data-bs-target="#tab-batco-slider" type="button" role="tab">BATCO SLIDER</button>
        </li>
        <li class="nav-item">
          <button class="nav-link text-uppercase font-weight-bold text-success" id="tab-batco-link" data-bs-toggle="tab" data-bs-target="#tab-batco" type="button" role="tab">BATCO</button>
        </li>
        <li class="nav-item">
          <button class="nav-link text-uppercase font-weight-bold text-success" id="tab-vocab-link" data-bs-toggle="tab" data-bs-target="#tab-vocab" type="button" role="tab">VOCAB CARD</button>
        </li>
        <li class="nav-item">
          <button class="nav-link text-uppercase font-weight-bold text-success" id="tab-slates-link" data-bs-toggle="tab" data-bs-target="#tab-slates" type="button" role="tab">SLATE CARDS</button>
        </li>
        <li class="nav-item">
          <button class="nav-link text-uppercase font-weight-bold text-success" id="tab-logging-link" data-bs-toggle="tab" data-bs-target="#tab-logging" type="button" role="tab">LOGGING</button>
        </li>
      </ul>
    </div>
  </div>
  
  <div class="card-body p-3 flex-grow-1 overflow-auto tab-content" id="resource-tab-content">
    
    <!-- BATCO SLIDER SVG TAB -->
    <div class="tab-pane fade show active h-100" id="tab-batco-slider" role="tabpanel">
      <div class="d-flex flex-column h-100">
        <div class="mb-2 d-flex justify-content-between align-items-center bg-dark p-1 px-2 border border-secondary rounded flex-wrap gap-1">
          <span class="small font-weight-bold text-success me-2">BATCO & SLIDER</span>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-success text-white px-2" id="btn-slider-up" title="Slide Up 1 Row">▲ Up</button>
              <button class="btn btn-outline-success text-white px-2" id="btn-slider-down" title="Slide Down 1 Row">▼ Down</button>
            </div>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-secondary text-white btn-zoom-in" data-target="batco-svg-wrapper" title="Zoom In">+</button>
              <button class="btn btn-outline-secondary text-white btn-zoom-out" data-target="batco-svg-wrapper" title="Zoom Out">-</button>
              <button class="btn btn-outline-secondary text-white btn-zoom-reset" data-target="batco-svg-wrapper" title="Reset Zoom">Reset</button>
            </div>
          </div>
        </div>
        <div class="d-flex flex-column align-items-center justify-content-center flex-grow-1 p-2 bg-black border border-secondary text-center overflow-hidden position-relative" id="batco-svg-container">
          <div id="batco-svg-wrapper" class="w-100 h-100 d-flex align-items-center justify-content-center">
            <!-- SVG dynamically loaded -->
          </div>
        </div>
      </div>
    </div>

    <!-- BATCO TAB -->
    <div class="tab-pane fade h-100" id="tab-batco" role="tabpanel">
      <div class="d-flex flex-column h-100">
        <div class="mb-2 d-flex justify-content-between align-items-center bg-dark p-1 px-2 border border-secondary rounded">
          <span class="small font-weight-bold text-success">BATCO REFERENCE</span>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary text-white btn-zoom-in" data-target="main-batco-img" title="Zoom In">+</button>
            <button class="btn btn-outline-secondary text-white btn-zoom-out" data-target="main-batco-img" title="Zoom Out">-</button>
            <button class="btn btn-outline-secondary text-white btn-zoom-reset" data-target="main-batco-img" title="Reset Zoom">Reset</button>
          </div>
        </div>
        <div class="d-flex flex-column align-items-center justify-content-center flex-grow-1 p-2 bg-black border border-secondary text-center overflow-hidden position-relative">
          <img id="main-batco-img" src="/static/images/BATCO/BATCO.png" alt="BATCO Reference Card" class="img-fluid rounded border border-success img-fit-contain">
        </div>
      </div>
    </div>

    <!-- VOCAB CARD TAB -->
    <div class="tab-pane fade h-100" id="tab-vocab" role="tabpanel">
      <div class="d-flex flex-column h-100">
        <div class="mb-2 d-flex gap-2 align-items-center">
          <select class="form-select form-select-sm bg-dark text-white border-secondary flex-grow-1" id="main-vocab-select"></select>
          <div class="btn-group btn-group-sm flex-shrink-0">
            <button class="btn btn-outline-secondary text-white btn-zoom-in" data-target="main-vocab-img" title="Zoom In">+</button>
            <button class="btn btn-outline-secondary text-white btn-zoom-out" data-target="main-vocab-img" title="Zoom Out">-</button>
            <button class="btn btn-outline-secondary text-white btn-zoom-reset" data-target="main-vocab-img" title="Reset Zoom">Reset</button>
          </div>
        </div>
        <div class="d-flex flex-column align-items-center justify-content-center flex-grow-1 p-2 bg-black border border-secondary text-center overflow-hidden position-relative">
          <img id="main-vocab-img" src="/static/images/VOCAB/001-OPS%201.png" alt="Vocab Card" class="img-fluid rounded border border-success img-fit-contain">
        </div>
      </div>
    </div>

    <!-- SLATE CARDS TAB -->
    <div class="tab-pane fade h-100" id="tab-slates" role="tabpanel">
      <div class="d-flex flex-column h-100">
        <div class="mb-2 d-flex gap-2 align-items-center">
          <select class="form-select form-select-sm bg-dark text-white border-secondary flex-grow-1" id="main-slate-select">
            <option value="CFF">CFF (Call for Fire)</option>
            <option value="CONTACT">CONTACT Report</option>
            <option value="MEDEVAC">MEDEVAC 9-Line</option>
            <option value="MISTAT">MISTAT (Casualty Report)</option>
            <option value="SITREP">SITREP (Situation Report)</option>
          </select>
          <div class="btn-group btn-group-sm flex-shrink-0">
            <button class="btn btn-outline-secondary text-white btn-zoom-in" data-target="main-slate-img" title="Zoom In">+</button>
            <button class="btn btn-outline-secondary text-white btn-zoom-out" data-target="main-slate-img" title="Zoom Out">-</button>
            <button class="btn btn-outline-secondary text-white btn-zoom-reset" data-target="main-slate-img" title="Reset Zoom">Reset</button>
          </div>
        </div>
        <div class="d-flex flex-column align-items-center justify-content-center flex-grow-1 p-2 bg-black border border-secondary text-center overflow-hidden position-relative">
          <img id="main-slate-img" src="/static/images/SLATE/CFF.png" alt="Slate Card" class="img-fluid rounded border border-success img-fit-contain">
        </div>
      </div>
    </div>

    <!-- LOGGING TAB -->
    <div class="tab-pane fade h-100" id="tab-logging" role="tabpanel">
      <div class="d-flex flex-column h-100">
        <div class="mb-2 d-flex justify-content-between align-items-center bg-dark p-1 px-2 border border-secondary rounded flex-wrap gap-1">
          <span class="small font-weight-bold text-success">RADIO LOGSHEET</span>
          <div class="d-flex gap-2">
            <button id="btn-add-log-row" class="btn btn-sm btn-outline-success py-0 px-2" aria-label="Add Radio Log Row">+ ADD ROW</button>
            <button id="btn-export-log-json" class="btn btn-sm btn-outline-info py-0 px-2" aria-label="Export Radio Log as JSON">JSON</button>
            <button id="btn-export-log-txt" class="btn btn-sm btn-outline-warning py-0 px-2" aria-label="Export Radio Log as Text">TXT</button>
            <div class="btn-group btn-group-sm ms-2">
              <button class="btn btn-outline-secondary text-white btn-zoom-in" data-target="main-logging-img" title="Zoom In" aria-label="Zoom In">+</button>
              <button class="btn btn-outline-secondary text-white btn-zoom-out" data-target="main-logging-img" title="Zoom Out" aria-label="Zoom Out">-</button>
              <button class="btn btn-outline-secondary text-white btn-zoom-reset" data-target="main-logging-img" title="Reset Zoom" aria-label="Reset Zoom">Reset</button>
            </div>
          </div>
        </div>
        <div class="table-responsive border border-secondary bg-black flex-grow-1 mb-2">
          <table class="table table-dark table-sm m-0 align-middle monospace">
            <thead>
              <tr>
                <th class="col-dtg">DTG</th>
                <th class="col-from">FROM</th>
                <th class="col-to">TO</th>
                <th class="col-precedence">PRECEDENCE</th>
                <th>MESSAGE / EVENT TEXT</th>
                <th class="col-initials">INIT</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="logsheet-tbody"></tbody>
          </table>
        </div>
        <div class="d-flex flex-column align-items-center justify-content-center p-2 bg-black border border-secondary text-center overflow-hidden position-relative preview-box-sm">
          <img id="main-logging-img" src="/static/images/LOGGING/LOGGING.png" alt="Logging Reference Card" class="img-fluid rounded border border-success img-fit-contain">
        </div>
      </div>
    </div>

  </div>
</section>
