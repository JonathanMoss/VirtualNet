<!-- PTT Transceiver Box -->
<section id="ptt-container" class="card mb-3 ptt-card-idle shadow-sm position-relative">
  
  <!-- PTT Card Header with Minimise Toggle -->
  <div id="ptt-card-header" class="card-header bg-dark text-uppercase d-flex justify-content-between align-items-center py-1 px-3 cursor-pointer-select-none">
    <span class="font-weight-bold d-flex align-items-center gap-2 small">
      <span>RADIO CONTROLS</span>
      <span id="ptt-header-status-badge" class="badge bg-secondary text-white ms-1">STANDBY</span>
    </span>
    <button id="btn-toggle-ptt-panel" class="btn btn-sm text-success p-0 border-0 shadow-none" title="Toggle PTT panel size">
      <span class="toggle-icon-ptt small font-weight-bold">▲ MINIMISE</span>
    </button>
  </div>

  <!-- Awaiting callsign lock overlay screen -->
  <div id="callsign-lock-overlay" class="position-absolute top-0 start-0 w-100 h-100 bg-dark d-flex flex-column align-items-center justify-content-center z-3">
    <div class="spinner-border text-success mb-3" role="status"></div>
    <h4 class="text-success text-center">AWAITING CALLSIGN ASSIGNMENT...</h4>
    <p class="text-muted text-center max-width-75">SUNRAY must assign your call sign before you can enter the active frequency.</p>
    <div class="border border-secondary p-2 bg-black text-center font-weight-bold">
      Operator NICK: <span id="overlay-nickname" class="text-tactical-amber">-</span>
    </div>
  </div>

  <!-- AudioContext Tap-to-Unmute Guard Banner (Mobile WebAudio Autoplay) -->
  <div id="audio-unmute-banner" class="alert alert-warning m-0 py-1 px-3 rounded-0 text-center font-weight-bold small d-none alert-audio-unmute-interactive">
    TAP TO UNMUTE AUDIO (Browser Audio Throttled)
  </div>

  <div id="ptt-card-body" class="card-body d-flex flex-row align-items-center justify-content-between py-2 px-2 px-sm-3 transition-all gap-2">
    <div class="mb-0 text-start flex-grow-1 min-w-0">
      <h5 class="card-title text-uppercase m-0 font-weight-bold text-truncate" id="ptt-state-text">STANDBY</h5>
      <p class="text-muted small m-0 mt-1 d-none d-sm-block" id="ptt-instruction">Hold SPACEBAR or push circular dial to speak (Max 20s)</p>
      <p class="text-warning small m-0 mt-1 d-none" id="audio-support-warning"></p>
      <div class="mt-1 d-none" id="active-speaker-box">
        <span class="text-muted small">Active Speaker:</span> <span id="active-speaker" class="font-weight-bold text-white small"></span>
      </div>

      <!-- Tactical Audio Level VU Meter & TX/RX Telemetry Scale Row -->
      <div class="d-flex align-items-center gap-2 mt-2 flex-wrap">
        <div id="vu-meter-bar" class="vu-meter-container gap-1 align-items-center d-none" title="Audio Level VU Meter">
          <span class="text-muted font-mono style-tiny me-1">VU</span>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment vu-amber"></div>
          <div class="vu-segment vu-red"></div>
        </div>
        <div id="telemetry-scale-wrapper" class="d-flex align-items-center gap-2">
          <canvas id="telemetry-sparkline" width="100" height="16" class="telemetry-sparkline-canvas" title="Real-time TX/RX telemetry scale"></canvas>
          <span id="telemetry-stats-text" class="text-muted font-mono style-tiny">STATUS: READY</span>
        </div>
      </div>
    </div>
    
    <!-- PTT Button -->
    <div class="d-flex align-items-center ms-1 ms-sm-2 flex-shrink-0">
      <div class="my-0 text-center flex-shrink-0">
        <button id="ptt-btn" class="ptt-button" disabled>PTT</button>
      </div>
    </div>
  </div>
</section>
