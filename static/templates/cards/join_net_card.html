<!-- Join Net Card (Student View) -->
<div id="join-net-card" class="col-md-5">
  <div class="card shadow-lg border-secondary">
    <div class="card-header text-center">
      <h3>🌐 JOIN RADIO NET</h3>
    </div>
    <div class="card-body p-4">
      <div id="join-net-form">
        <div class="mb-3">
          <label for="join-pin" class="form-label text-uppercase">Net Access PIN</label>
          <input type="text" class="form-control text-uppercase text-center font-weight-bold" id="join-pin" placeholder="e.g. A3F9" maxlength="4" autocomplete="off" required>
        </div>
        <div class="mb-3">
          <label for="join-nickname" class="form-label text-uppercase">NICK</label>
          <input type="text" class="form-control" id="join-nickname" placeholder="e.g. JOHN" maxlength="20" autocomplete="off" required>
        </div>
        <button type="button" id="btn-join-net" class="btn btn-tactical w-100 mt-2">CONNECT TO NET</button>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary small">
        <a href="/guide/student" target="_blank" class="text-decoration-none text-phosphor-green">📖 Student Guide (in new tab)</a>
        <a href="#" id="toggle-create-view" class="text-decoration-none text-tactical-amber">SUNRAY Portal</a>
      </div>
    </div>
  </div>
</div>
