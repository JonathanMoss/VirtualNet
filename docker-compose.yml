services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  web-app:
    build: .
    depends_on:
      - redis
    ports:
      - "5002:5000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./static:/app/static
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/data/virtualnet.db
      - REDIS_URL=redis://redis:6379/0
    restart: always

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: always

  test:
    build: .
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - FLASK_ENV=testing
      - DATABASE_URL=sqlite:////app/data/virtualnet_test.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    working_dir: /app
    command: ["./run_checks.sh"]
    restart: "no"
