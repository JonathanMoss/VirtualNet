services:
  web-app:
    build: .
    ports:
      - "5002:5000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./static:/app/static
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/data/virtualnet.db
    restart: always

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: always
